<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScanLedger Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #111827; color: #f9fafb; font-family: 'Spline Sans', 'Noto Sans', sans-serif; text-align: center; padding: 2rem; }
      .card { max-width: 420px; background: rgba(31,41,55,0.7); border-radius: 1.5rem; padding: 2.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
      h1 { margin-bottom: 1rem; font-size: 1.75rem; }
      p { margin-bottom: 1rem; line-height: 1.5; color: #cbd5f5; }
      a { color: #38e07b; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline Mode</h1>
      <p>ScanLedger is offline. We will sync your scans and exports once you reconnect.</p>
      <p><a href="/">Return to dashboard</a> when you are back online.</p>
    </div>
  </body>
</html>
