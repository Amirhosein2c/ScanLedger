<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
  <link as="style"
    href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Spline+Sans%3Awght%40400%3B500%3B700"
    onload="this.rel='stylesheet'" rel="stylesheet" />
  <title>Welcome_Onboarding.html</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="css/welcome_onboarding.css" />
  <!-- PWA / App Manifest -->
  <link rel="manifest" href="manifest.json" />
  <!-- iOS support: only include icon sizes that exist in project -->
  <link rel="apple-touch-icon" sizes="72x72" href="images/icons/icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="images/icons/icon-128x128.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="images/icons/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="384x384" href="images/icons/icon-384x384.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="images/icons/icon-512x512.png" />
  <!-- Primary brand color -->
  <meta name="theme-color" content="#38e07b" />
  <!-- iOS status bar color (supported when standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScanLedger" />
</head>

<body class="bg-[#111827] text-white">
  <div class="relative flex size-full min-h-screen flex-col justify-between overflow-x-hidden pt-safe">
    <div class="flex flex-col">
      <div class="relative h-80">
        <img alt="Financial documents and a phone" class="absolute inset-0 h-full w-full object-cover"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQNf2prOH6SDbyyQvcqRCtCGJYxlBX2p7koeYY-tOsVDlogAK8MlE1Dj9k9CL5Pu1Vcq2-1zPIbLYPAmTicu8USSQjIlo2P4fm1b5Mb9vvSl6G8OAJerZ7QHW6OOzYa9JIgMEto0ewXgCRIA-QYZSOSC63WQntCFrk9ZguPWLtsaDz7DejxE-vN-A5a5GMjYJHrKboeOY1WlxdWGevQqr0_KvT2KCIKDc6JSsRG9_KoiunQ_Pk29KAU6CkDJf69AOreG4qebsFDTQ" />
        <div class="absolute inset-0 bg-gradient-to-t from-[#111827] to-transparent"></div>
      </div>
      <div class="flex flex-col items-center px-6 pb-6 text-center -mt-16 z-10">
        <div class="mb-4">
          <svg fill="none" height="64" viewBox="0 0 64 64" width="64" xmlns="http://www.w3.org/2000/svg">
            <rect fill="#38E07B" height="64" rx="32" width="64"></rect>
            <path
              d="M26 20H42C43.1046 20 44 20.8954 44 22V42C44 43.1046 43.1046 44 42 44H22C20.8954 44 20 43.1046 20 42V26L26 20Z"
              fill="#111827"></path>
            <path d="M26 20L20 26H24C25.1046 26 26 25.1046 26 24V20Z" fill="#38E07B"></path>
            <path d="M28 32H38" stroke="white" stroke-linecap="round" stroke-width="2"></path>
            <path d="M28 38H34" stroke="white" stroke-linecap="round" stroke-width="2"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold tracking-tight">Welcome to ScanLedger</h1>
        <p class="mt-2 max-w-sm text-base text-gray-300">
          Scan, digitize, and organize your financial documents effortlessly.
        </p>
      </div>
      <div class="flex flex-col gap-4 px-6">
        <button id="get-started-btn"
          class="flex w-full items-center justify-center rounded-full bg-[var(--primary-color)] h-14 text-[#111827] text-lg font-bold transition-transform active:scale-95">
          Get Started
        </button>
        <button id="login-btn"
          class="flex w-full items-center justify-center rounded-full bg-[#1F2937] h-14 text-white text-lg font-bold transition-transform active:scale-95">
          Log In
        </button>
        <button id="install-btn"
          class="hidden w-full items-center justify-center rounded-full border border-[var(--primary-color)] h-14 text-[var(--primary-color)] text-lg font-bold transition-colors hover:bg-[var(--primary-color)] hover:text-[#111827] active:scale-95">
          Install App
        </button>
      </div>
    </div>
    <script>
      // Mobile viewport height fix (iOS Chrome/Safari address bar collapse) & safe area
      function setDocHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      window.addEventListener('resize', setDocHeight);
      setDocHeight();
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        document.body.classList.add('pwa-safe-area');
      }
    </script>
    <script src="js/pwa.js" defer></script>
    <script src="js/welcome_onboarding.js" defer></script>
</body>

</html>
