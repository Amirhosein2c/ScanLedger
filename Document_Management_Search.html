        <div class="px-4 pb-3">

            <input
              class="form-input w-full rounded-full text-white focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] border-none bg-[#1F2937] h-12 placeholder:text-[#D1D5DB] pl-11 pr-4 text-base font-normal leading-normal"

          </div>
        </div>
        <div class="flex gap-2 p-3 overflow-x-auto">
          <button
            class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#1F2937] pl-4 pr-3 text-sm font-medium text-white hover:bg-white/10 transition-colors">
            <span>Date</span>
            <span class="material-symbols-outlined text-xl">

            </span>
          </button>
          <button
            class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#1F2937] pl-4 pr-3 text-sm font-medium text-white hover:bg-white/10 transition-colors">
            <span>Category</span>
            <span class="material-symbols-outlined text-xl">
              keyboard_arrow_down
            </span>
          </button>
          <button
            class="flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-[#1F2937] pl-4 pr-3 text-sm font-medium text-white hover:bg-white/10 transition-colors">
            <span>Vendor</span>
            <span class="material-symbols-outlined text-xl">
              keyboard_arrow_down
            </span>
          </button>
        </div>
      </header>
      <main class="px-4">
        <div class="flex justify-between items-center pb-2 pt-4">
          <h3 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">Recent</h3>
          <button class="flex items-center gap-1 text-sm text-[var(--primary-color)] font-medium">
            <span>Sort</span>
            <span class="material-symbols-outlined text-xl">
              swap_vert
            </span>
          </button>
        </div>
        <div class="space-y-2"></div>
      </main>
