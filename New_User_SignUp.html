<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<!-- iOS PWA fullscreen meta -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ScanLedger" />
<link rel="apple-touch-icon" href="./images/icons/icon-152x152.png" />
<title>New_User_SignUp.html</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="./css/login_registration.css" />
<link rel="stylesheet" href="./css/mobile_base.css" />
<!-- <script src="./js/viewport_fix.js" defer></script> -->
</head>
<body class="bg-[var(--background-color)] text-[var(--text-color)]">
<div class="flex flex-col min-h-screen">
<main class="flex-grow flex flex-col justify-center px-6 sm:px-8">
  <div class="w-full max-w-sm mx-auto">
    <div class="text-center mb-12">
      <svg class="w-16 h-16 mx-auto mb-4 text-[var(--primary-color)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      <h1 class="text-4xl font-bold tracking-tighter">Create Account</h1>
      <p class="mt-2 text-lg text-[var(--secondary-text-color)]">Join ScanLedger to get started</p>
    </div>
    <form class="space-y-6">
      <div>
        <label class="sr-only" for="signup_email">Email</label>
        <input id="signup_email" name="email" type="email" autocomplete="email" required placeholder="Email" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm" />
      </div>
      <div>
        <label class="sr-only" for="signup_password">Password</label>
        <input id="signup_password" name="password" type="password" autocomplete="new-password" required placeholder="Password" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm" />
      </div>
      <div>
        <label class="sr-only" for="signup_confirm_password">Confirm Password</label>
        <input id="signup_confirm_password" name="confirm_password" type="password" autocomplete="new-password" required placeholder="Confirm Password" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm" />
      </div>
      <div>
        <label class="sr-only" for="signup_name">Name</label>
        <input id="signup_name" name="name" type="text" autocomplete="given-name" required placeholder="Name" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm" />
      </div>
      <div>
        <label class="sr-only" for="signup_surname">Surname</label>
        <input id="signup_surname" name="surname" type="text" autocomplete="family-name" required placeholder="Surname" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm" />
      </div>
      <div>
        <button type="submit" class="flex w-full justify-center rounded-md bg-[var(--primary-color)] px-4 py-3 text-sm font-semibold leading-6 text-gray-900 shadow-sm hover:bg-opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-color)] transition-colors">Sign Up</button>
      </div>
    </form>

    <div class="mt-8" aria-hidden="true">
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-white/10"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-3 bg-[var(--background-color)] text-[var(--secondary-text-color)]">Or continue with</span>
        </div>
      </div>
    </div>

    <div class="mt-10 space-y-3">
      <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md border border-white/10 bg-white text-gray-900 font-medium py-3 text-sm hover:bg-gray-100 transition-colors">
        <img src="https://www.gstatic.com/images/branding/product/1x/googleg_24dp.png" alt="Google" class="w-5 h-5"/>
        <span>Signup with Google</span>
      </button>
      <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-[#1877F2] border border-white/10 text-white font-medium py-3 text-sm hover:bg-[#266fe0] transition-colors">
        <!-- Facebook Icon -->
        <svg class="w-5 h-5" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M22.675 0H1.325C.593 0 0 .593 0 1.326v21.348C0 23.406.593 24 1.325 24h11.494v-9.294H9.847v-3.622h2.972V8.413c0-2.943 1.796-4.549 4.416-4.549 1.255 0 2.336.093 2.651.135v3.07h-1.82c-1.428 0-1.703.679-1.703 1.675v2.196h3.406l-.444 3.622h-2.962V24h5.807C23.406 24 24 23.406 24 22.674V1.326C24 .593 23.406 0 22.675 0z"/></svg>
        <span>Signup with Facebook</span>
      </button>
      <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-[#111827] border border-white/10 text-white font-medium py-3 text-sm hover:bg-[#1f2937] transition-colors">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft" class="w-5 h-5"/>
        <span>Signup with Microsoft</span>
      </button>
      <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-black border border-white/10 text-white font-medium py-3 text-sm hover:bg-gray-900 transition-colors">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" class="w-5 h-5" style="filter: invert(1);"/>
        <span>SignUp with Apple</span>
      </button>
    </div>

  </div>
</main>
<footer class="py-8 px-6 sm:px-8">
  <div class="text-center text-sm text-[var(--secondary-text-color)]">
    Already have an account?
    <a class="font-medium text-[var(--primary-color)] hover:text-opacity-80" href="Login_Registration.html">Sign In</a>
  </div>
</footer>
</div>

<!-- Add these scripts before closing </body> tag in New_User_SignUp.html -->
<script src="./js/config.js" defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./js/google_oauth.js" defer></script>
<script src="./js/api_base.js" defer></script>
<script src="./js/new_user_signup.js" defer></script>
</body></html>
