<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScanLedger - Login</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/login_registration.css" />
  </head>
<body class="bg-[var(--background-color)] text-[var(--text-color)]">
<div class="flex flex-col min-h-screen">
<main class="flex-grow flex flex-col justify-center px-6 sm:px-8">
<div class="w-full max-w-sm mx-auto">
<div class="text-center mb-12">
<svg class="w-16 h-16 mx-auto mb-4 text-[var(--primary-color)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
<h1 class="text-4xl font-bold tracking-tighter">ScanLedger</h1>
<p class="mt-2 text-lg text-[var(--secondary-text-color)]">Securely access your account</p>
</div>
<form class="space-y-6">
<div>
<label class="sr-only" for="email">Email or Username</label>
<input autocomplete="email" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm sm:leading-6" id="email" name="email" placeholder="Email or Username" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<input autocomplete="current-password" class="appearance-none block w-full px-4 py-3 rounded-md border-0 bg-[var(--field-background)] placeholder-[var(--placeholder-color)] text-[var(--text-color)] focus:ring-2 focus:ring-inset focus:ring-[var(--primary-color)] sm:text-sm sm:leading-6" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex items-center justify-end">
<div class="text-sm">
<a class="font-medium text-[var(--primary-color)] hover:text-opacity-80" href="#">
                                Forgot your password?
                            </a>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-md bg-[var(--primary-color)] px-4 py-3 text-sm font-semibold leading-6 text-gray-900 shadow-sm hover:bg-opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--primary-color)] transition-colors" type="submit">
                            Sign In
                        </button>
</div>
</form>
<div class="mt-8" aria-hidden="true">
  <div class="relative">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-white/10"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="px-3 bg-[var(--background-color)] text-[var(--secondary-text-color)]">Or continue with</span>
    </div>
  </div>
</div>
<div class="mt-10 space-y-3">
  <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md border border-white/10 bg-white text-gray-900 font-medium py-3 text-sm hover:bg-gray-100 transition-colors">
    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_24dp.png" alt="Google" class="w-5 h-5"/>
    <span>Login with Google</span>
  </button>
  <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-[#1877f3] text-white font-medium py-3 text-sm hover:bg-[#166fe0] transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" class="w-5 h-5"><path d="M22.675 0h-21.35C.595 0 0 .592 0 1.326v21.348C0 23.408.595 24 1.325 24h11.495v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.797.143v3.24l-1.918.001c-1.504 0-1.797.715-1.797 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116C23.406 24 24 23.408 24 22.674V1.326C24 .592 23.406 0 22.675 0"/></svg>
    <span>Login with Facebook</span>
  </button>
  <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-[#111827] border border-white/10 text-white font-medium py-3 text-sm hover:bg-[#1f2937] transition-colors">
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="Microsoft" class="w-5 h-5"/>
    <span>Login with Microsoft</span>
  </button>
  <button type="button" class="w-full flex items-center justify-center gap-3 rounded-md bg-black border border-white/10 text-white font-medium py-3 text-sm hover:bg-gray-900 transition-colors">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" class="w-5 h-5" style="filter: invert(1);"/>
    <span>Login with Apple</span>
  </button>
</div>
</div>
</main>
<footer class="py-8 px-6 sm:px-8">
<div class="text-center text-sm text-[var(--secondary-text-color)]">
                Don't have an account?
          <a class="font-medium text-[var(--primary-color)] hover:text-opacity-80" href="#">
            Sign Up
          </a>
          <!-- Added id for JS navigation -->
          <a id="sign-up-link" style="display:none;"></a>
</div>
</footer>
</div>

<script src="js/login_registration.js" defer></script></body></html>
