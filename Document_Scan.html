<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- iOS PWA full screen & status bar styling -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScanLedger" />
  <link rel="apple-touch-icon" href="images/icons/icon-152x152.png" />
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
  <link as="style"
    href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Spline+Sans%3Awght%40400%3B500%3B700"
    onload="this.rel='stylesheet'" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <title>ScanLedger</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- PDF.js for rendering uploaded PDF first page -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>
  <script>
    // Configure pdf.js worker (safe to run even if script blocked; fallback loader in JS will re-run)
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <link rel="stylesheet" href="css/document_scan.css" />
</head>


<body class="bg-[#111827]">
  <!-- <script src="js/viewport_fix.js" defer></script> -->
  <div
    class="relative flex size-full min-h-screen flex-col bg-[var(--neutral-900)] dark justify-between group/design-root"
    data-full-screen style='font-family: "Spline Sans", "Noto Sans", sans-serif;'>
    <div class="sticky top-0">
      <header class="flex items-center justify-between p-4 pt-safe">
        <button class="flex items-center justify-center rounded-full text-white/50 hover:text-white transition-colors">
          <span class="material-symbols-outlined"> flash_on </span>
        </button>
        <h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Scan Document</h2>
        <button class="flex items-center justify-center rounded-full text-white/50 hover:text-white transition-colors">
          <span class="material-symbols-outlined"> close </span>
        </button>
      </header>
    </div>
    <div class="flex flex-col flex-1">
      
      <main class="flex-1 flex items-center justify-center p-4">
        <div
          class="w-full aspect-[3/4] rounded-2xl border-4 border-dashed border-white/20 flex items-center justify-center relative overflow-hidden">
          <div class="absolute inset-0 bg-gray-500 animate-pulse" id="scan-bg"></div>
          <video id="camera-stream" autoplay playsinline
            class="absolute inset-0 w-full h-full object-cover z-0 hidden"></video>
          <img id="captured-image" class="absolute inset-0 w-full h-full object-cover z-0 hidden"
            alt="Captured document" />
          <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] h-[2px] bg-[var(--primary-500)]/50 animate-scan">
          </div>
          <p class="text-white/80 z-10 text-center">Position document within the frame <br /> Then press the capture
            button</p>

          <!-- Bottom Left Circular Arrow (Retake) Button -->
          <button id="retake-btn" disabled aria-disabled="true"
            class="absolute bottom-6 left-6 flex items-center justify-center rounded-full size-14 bg-white/10 text-white/60 shadow-lg z-20 opacity-40 pointer-events-none">
            <span class="material-symbols-outlined text-3xl">refresh</span>
          </button>
          <!-- Bottom Right Confirm (Check) Button -->
          <button id="confirm-btn" disabled aria-disabled="true"
            class="absolute bottom-6 right-6 flex items-center justify-center rounded-full size-14 bg-white/10 text-white/60 shadow-lg z-20 opacity-40 pointer-events-none">
            <span class="material-symbols-outlined text-3xl">check</span>
          </button>
        </div>
      </main>
      <div class="flex items-center justify-center gap-6 p-4">
        <div class="flex items-center gap-4 bg-black/30 backdrop-blur-sm p-2 rounded-full">
          <button class="text-white px-4 py-2 rounded-full bg-white/10">Single</button>
          <button class="text-white/60 px-4 py-2 rounded-full">Batch</button>
        </div>
      </div>
      <div class="flex items-center justify-center gap-6 p-4">
        <button class="flex shrink-0 items-center justify-center rounded-full size-12 bg-white/10 text-white shadow-lg">
          <span class="material-symbols-outlined"> photo_library </span>
        </button>
        <button
          class="flex shrink-0 items-center justify-center rounded-full size-20 bg-white text-[var(--neutral-900)] shadow-lg ring-4 ring-white/20">
          <span class="material-symbols-outlined text-4xl"> camera </span>
        </button>
        <button id="pdf-upload-btn"
          class="flex shrink-0 items-center justify-center rounded-full size-12 bg-white/10 text-white shadow-lg"
          title="Upload PDF">
          <span class="material-symbols-outlined"> description </span>
        </button>
        <input id="pdf-file-input" type="file" accept="application/pdf" class="hidden" />
      </div>
    </div>
    
  </div>
  <div class="sticky bottom-0">
    <footer class="bg-[var(--neutral-800)]">
      <div class="flex border-t border-[var(--neutral-700)] px-4 pb-3 pt-2">
        <a class="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[var(--primary-500)]" href="#">
          <span class="material-symbols-outlined"> document_scanner </span>
          <p class="text-xs font-medium leading-normal tracking-[0.015em]">Scan</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--neutral-400)]"
          href="Document_Management_Search.html">
          <span class="material-symbols-outlined"> folder </span>
          <p class="text-xs font-medium leading-normal tracking-[0.015em]">Documents</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--neutral-400)]"
          href="Dashboard_Overview.html">
          <span class="material-symbols-outlined"> bar_chart </span>
          <p class="text-xs font-medium leading-normal tracking-[0.015em]">Dashboard</p>
        </a>
        <a class="flex flex-1 flex-col items-center justify-end gap-1 text-[var(--neutral-400)]"
          href="User_Profile_Settings.html">
          <span class="material-symbols-outlined"> settings </span>
          <p class="text-xs font-medium leading-normal tracking-[0.015em]">Settings</p>
        </a>
      </div>
      <div class="h-5 bg-[var(--neutral-800)]"></div>
    </footer>
  </div>

  <script src="js/api_base.js" defer></script>
  <script src="js/document_scan.js" defer></script>
</body>

</html>
