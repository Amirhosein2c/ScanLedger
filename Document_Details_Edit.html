<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<!-- iOS PWA fullscreen meta -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ScanLedger" />
<link rel="apple-touch-icon" href="images/icons/icon-152x152.png" />
<title>Document_Details_Edit.html</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/document_details_edit.css" />
<link rel="stylesheet" href="css/mobile_base.css" />
<!-- <script src="js/viewport_fix.js" defer></script> -->
  </head>
<body class="bg-[#111827] text-[var(--text-primary)]">
<div class="flex flex-col min-h-screen">
<header class="sticky top-0 z-10 bg-[var(--background-color)] shadow-sm pt-safe">
<div class="flex items-center p-4">
<button class="p-2 -ml-2" onclick="window.location.href='Document_Scan.html'">
<span class="material-symbols-outlined text-3xl">arrow_back_ios_new</span>
</button>
<h1 class="flex-1 text-center text-xl font-bold tracking-tight pr-8">Review &amp; Edit</h1>
</div>
</header>
<main class="flex-1 overflow-y-auto p-4 space-y-6">
<div class="aspect-[9/12] rounded-2xl overflow-hidden shadow-lg">
<img id="review-image" alt="Scanned Document" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxJmmNFAN5fa4ImmQdjTtIEgQJr93B8BiKT1d994eU8QNF1E4I797b9qeq-qKhuZfIXg89SgSCjcvTFw6eSUzzLuk1vRiXYndWPIKpWsDNozW-gEiaGGZo9ezXueItm_WB8DjW2vboPQttKvtV3NdbSgb4FQKmPSzMJcmivW4aFDLxyojP2owBTGVPDURacFQuvEGhWoqtFfAKM0lvUm1hvU5clNRaQ5TRrZXMVEb3Efc3K2xRYIolEUdBcZGPBg2Q1LY0zUsbqT0"/>
</div>

<!-- Dynamic OCR fields container -->
<div id="extracted-fields-container" class="space-y-4 mt-6"></div>

<!-- Default fields shown only if no OCR data available -->
<div id="default-fields-block" class="space-y-4">
<label class="block">
<span class="text-sm font-medium text-[var(--text-secondary)]">Date</span>
<input class="mt-1 block w-full rounded-xl border-transparent bg-[var(--input-bg)] px-4 py-3 text-base text-white focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50" type="date" value="2023-10-27"/>
</label>
<label class="block">
<span class="text-sm font-medium text-[var(--text-secondary)]">Amount</span>
<div class="relative mt-1">
<span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-[var(--text-secondary)]">$</span>
<input class="block w-full rounded-xl border-transparent bg-[var(--input-bg)] pl-8 pr-4 py-3 text-base text-white focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50" type="text" value="125.50"/>
</div>
</label>
<label class="block">
<span class="text-sm font-medium text-[var(--text-secondary)]">Vendor</span>
<input class="mt-1 block w-full rounded-xl border-transparent bg-[var(--input-bg)] px-4 py-3 text-base text-white focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50" placeholder="e.g. Starbucks" type="text"/>
</label>
<label class="block">
<span class="text-sm font-medium text-[var(--text-secondary)]">Category</span>
<select class="mt-1 block w-full rounded-xl border-transparent bg-[var(--input-bg)] px-4 py-3 text-base text-white focus:border-[var(--primary-color)] focus:ring focus:ring-[var(--primary-color)] focus:ring-opacity-50 appearance-none bg-no-repeat bg-right-in-image" style="background-image: url('data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27none%27 viewBox=%270 0 20 20%27%3e%3cpath stroke=%27%2396c5a9%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke-width=%271.5%27 d=%27M6 8l4 4 4-4%27/%3e%3c/svg%3e'); background-position: right 1rem center; background-size: 1.5em 1.5em;">
<option>Groceries</option>
<option>Transport</option>
<option>Entertainment</option>
<option selected="">Food &amp; Drink</option>
</select>
</label>
</div>

<div class="flex gap-4 pt-4">
<button id="discard-btn" class="flex-1 rounded-full bg-[var(--input-bg)] py-3 text-center text-base font-bold text-white">Discard</button>
<button id="save-btn" class="flex-1 rounded-full bg-[var(--primary-color)] py-3 text-center text-base font-bold text-[var(--background-color)]">Save</button>
</div>
</main>
<footer class="sticky bottom-0 z-10 border-t border-[#264532] bg-[#1b3124] pb-safe-area-bottom">
<nav class="flex justify-around p-2">
<a class="flex flex-col items-center gap-1 p-2 text-[var(--primary-color)]" href="Document_Scan.html">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1, 'wght' 700;">photo_camera</span>
<span class="text-xs font-medium">Scan</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-[var(--text-secondary)]" href="Document_Management_Search.html">
<span class="material-symbols-outlined">description</span>
<span class="text-xs font-medium">Documents</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-[var(--text-secondary)]" href="Dashboard_Overview.html">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-xs font-medium">Dashboard</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-[var(--text-secondary)]" href="User_Profile_Settings.html">
<span class="material-symbols-outlined">settings</span>
<span class="text-xs font-medium">Settings</span>
</a>
</nav>
</footer>
</div>

<script src="js/document_details_edit.js" defer></script></body></html>
