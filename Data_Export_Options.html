<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<!-- iOS PWA fullscreen meta -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ScanLedger" />
<link rel="apple-touch-icon" href="images/icons/icon-152x152.png" />
<title>Data_Export_Options.html</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/data_export_options.css" />
<link rel="stylesheet" href="css/mobile_base.css" />
<script src="js/viewport_fix.js" defer></script>
  </head>
<body class="bg-[#111827] text-white" data-full-screen>
<div class="relative flex size-full min-h-screen flex-col">
<header class="sticky top-0 z-10 bg-[#111827]/80 backdrop-blur-sm pt-safe">
<div class="flex items-center p-4">
<button class="flex size-10 items-center justify-center rounded-full text-white/80 transition-colors hover:bg-white/10">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="flex-1 text-center text-lg font-semibold tracking-tight text-white pr-10">Export Data</h1>
</div>
</header>
<main class="flex-1 overflow-y-auto px-4 pb-24">
<div class="flex flex-col gap-8 py-4">
<section>
<h2 class="mb-3 text-base font-semibold text-white/90">Export Destination</h2>
<div class="flex flex-col gap-3 rounded-xl bg-[#1F2937] p-1">
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white/70">email</span>
<span class="text-sm font-medium">Email</span>
</div>
<input class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="export-destination" type="radio" value="email"/>
</label>
<div class="h-px w-full bg-[#333]"></div>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white/70">cloud</span>
<span class="text-sm font-medium">Google Drive</span>
</div>
<input class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="export-destination" type="radio" value="gdrive"/>
</label>
<div class="h-px w-full bg-[#333]"></div>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white/70">cloud_sync</span>
<span class="text-sm font-medium">Dropbox</span>
</div>
<input class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="export-destination" type="radio" value="dropbox"/>
</label>
<div class="h-px w-full bg-[#333]"></div>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white/70">save</span>
<span class="text-sm font-medium">Local Storage</span>
</div>
<input id="dest-local" checked class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="export-destination" type="radio" value="local"/>
</label>
</div>
</section>
<section>
<h2 class="mb-3 text-base font-semibold text-white/90">File Format</h2>
<div class="flex flex-col gap-3 rounded-xl bg-[#1F2937] p-1">
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<span class="text-sm font-medium">CSV</span>
<input id="format-csv" checked class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="file-format" type="radio" value="csv"/>
</label>
<div class="h-px w-full bg-[#333]"></div>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<span class="text-sm font-medium">Excel</span>
<input class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="file-format" type="radio" value="excel"/>
</label>
<div class="h-px w-full bg-[#333]"></div>
<label class="flex cursor-pointer items-center justify-between gap-4 rounded-lg p-3 transition-colors hover:bg-white/5 has-[:checked]:bg-[#1F2937]">
<span class="text-sm font-medium">Google Sheets</span>
<input class="form-radio h-5 w-5 border-[#424242] bg-[#1F2937] text-transparent focus:ring-0 focus:ring-offset-0" name="file-format" type="radio" value="gsheet"/>
</label>
</div>
</section>

</div>
</main>
<footer class="fixed bottom-0 left-0 right-0 bg-[#111827]/80 backdrop-blur-sm p-4">
<button class="flex w-full items-center justify-center rounded-xl bg-[var(--primary-500)] h-12 px-6 text-base font-bold text-white transition-colors hover:bg-[var(--primary-600)]">
        Export
      </button>
</footer>
</div>

<script src="js/data_export_options.js" defer></script></body></html>
