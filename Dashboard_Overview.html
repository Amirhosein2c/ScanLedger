<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <!-- iOS PWA fullscreen meta -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScanLedger" />
  <link rel="apple-touch-icon" href="images/icons/icon-152x152.png" />
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
  <link as="style"
    href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Spline+Sans%3Awght%40400%3B500%3B700"
    onload="this.rel='stylesheet'" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <title>Dashboard_Overview.html</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="css/dashboard_overview.css" />
</head>

<body class="bg-[#111827] min-h-dvh">
  <!-- <script src="js/viewport_fix.js" defer></script> -->
  <div class="relative flex size-full min-h-dvh flex-col dark justify-between group/design-root" data-full-screen
    style='font-family: "Spline Sans", "Noto Sans", sans-serif;'>
    <div class="flex-grow">
      <header class="sticky top-0 z-10 bg-[#111827]/80 backdrop-blur-sm pt-safe">
        <div class="flex items-center p-4">
          <div class="flex items-center gap-4">
            <div id="dashboard-avatar" class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
              style='background-image: url("https://www.gravatar.com/avatar/?d=mp&s=128"); background-color:#374151;'>
            </div>
            <div>
              <p class="text-sm text-gray-400">Welcome back,</p>
              <h1 id="dashboard-username" class="text-white text-xl font-bold">User</h1>
            </div>
          </div>
        </div>
      </header>
      <main class="p-4">
        <section class="grid grid-cols-2 gap-4 mb-8">
          <div class="flex flex-col gap-2 rounded-xl p-4 bg-[#1F2937]">
            <p class="text-gray-300 text-sm font-medium">Total Docs</p>
            <p class="text-white text-2xl font-bold">0</p>
            <p class="text-[var(--primary-color)] text-sm font-medium">0%</p>
          </div>
          <div class="flex flex-col gap-2 rounded-xl p-4 bg-[#1F2937]">
            <p class="text-gray-300 text-sm font-medium">Monthly Scans</p>
            <p class="text-white text-2xl font-bold">0</p>
            <p class="text-[var(--primary-color)] text-sm font-medium">0%</p>
          </div>
        </section>
        <section>
          <h2 class="text-white text-lg font-bold mb-3">Recent Scans</h2>
          <div id="recent-scans" class="space-y-2"></div>
          <div id="no-recent-scans" class="text-gray-400 text-sm">No recent scans yet.</div>
          <div class="h-4"></div>
        </section>
      </main>
    </div>
    <div class="sticky bottom-0">
      <div class="flex justify-center p-4">
        </button>
        <button id="scan-new-doc-btn"
          class="flex items-center justify-center gap-2 rounded-full h-14 w-full max-w-xs bg-[var(--primary-color)] text-[#111827] text-lg font-bold">
          <span class="material-symbols-outlined">
            qr_code_scanner
          </span>
          <span>Scan New Document</span>
        </button>
      </div>
      <nav class="flex justify-around border-t border-[#1F2937] bg-[#1F2937] py-2">
        <a class="flex flex-col items-center justify-end gap-1 text-gray-400" href="Document_Scan.html">
          <span class="material-symbols-outlined">
            camera_alt
          </span>
          <p class="text-xs font-medium">Scan</p>
        </a>
        <a class="flex flex-col items-center justify-end gap-1 text-gray-400" href="Document_Management_Search.html">
          <span class="material-symbols-outlined">
            folder
          </span>
          <p class="text-xs font-medium">Documents</p>
        </a>
        <a class="flex flex-col items-center justify-end gap-1 text-white" href="Dashboard_Overview.html">
          <span class="material-symbols-outlined">
            dashboard
          </span>
          <p class="text-xs font-medium">Dashboard</p>
        </a>
        <a class="flex flex-col items-center justify-end gap-1 text-gray-400" href="User_Profile_Settings.html">
          <span class="material-symbols-outlined">
            settings
          </span>
          <p class="text-xs font-medium">Settings</p>
        </a>
      </nav>
      <div class="h-3 bg-[#1F2937]"></div>
    </div>
  </div>

  <script src="js/dashboard_overview.js" defer></script>
</body>

</html>
